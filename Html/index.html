<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorebound | Login</title>
  </head>
  <body>
    <header>
      <table width="100%">
        <tr>
          <td>
            <h1>Lorebound</h1>
          </td>
          <td align="center">
            <p>A roguelike by Andrew Hokanson</p>
          </td>  
          <td align="right">
            <a href="https://github.com/Gfniblib/Startup">Github Repository</a>
          </td>  
        </tr>
      </table>
      <nav>
        <a href="index.html">Login</a>
        <a href="game.html">Game</a>
        <a href="leaderboard.html">High Scores</a>
      </nav>
    </header>

    <main>
      <h2>Login</h2>
      <p>Create a new account or log into your existing one.</p>

      <form>
        <label>
          Player name
          <input type="text" name="username" placeholder="Aria Dawn" />
        </label>

        <label>
          Email
          <input type="email" name="email" placeholder="aria@lorebound.com" />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Enter password" />
        </label>

        <button type="submit">Create account</button>
        <button type="button">Login</button>
      </form>
    </main>
  </body>
</html>
