<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorebound | Login</title>
  </head>
  <body>
    <header>
      <table width="100%">
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 12px;">
              <h1 style="margin: 0;">Lorebound</h1>
              <img src="images/dogemorionhat.jpg" alt="Doge Morion Hat" width="60" height="60" />
            </div>
          </td>
          <td align="center">
            <p>A roguelike by Andrew Hokanson</p>
          </td>  
          <td align="right">
            <a href="https://github.com/Gfniblib/Startup">Github Repository</a>
          </td>  
        </tr>
      </table>
      <nav>
        <a href="index.html">Login</a>
        <a href="game.html">Game</a>
        <a href="leaderboard.html">High Scores</a>
      </nav>
    </header>

    <main>
      <h2>Login</h2>
      <p>Create a new account or login</p>
      <fieldset>
        <legend>Account Information</legend>
        <form>
          <table>
            <tr>
              <td>
                <label>
                  Player name
                  <input type="text" name="username" placeholder="Aria Dawn" />
                </label>
              </td>
            </tr>
            <tr>
              <td>
                <label>
                  Password
                  <input type="password" name="password" placeholder="Enter password" />
                </label>
              </td>
            </tr>
            <tr>
              <td>
                <button type="submit">Create account</button>
                <button type="button">Login</button>
              </td>
            </tr>
          </table>
        </form>
      </fieldset>
    </main>
  </body>
  <footer style="position: fixed; bottom: 0; left: 0;width: 100%; background-color: #290c5c; color: rgb(244, 243, 249); text-align: center;">
    <p>&copy; 2026 Lorebound no copyrights here. No rights reserved.</p>
  </footer>
</html>
