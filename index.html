<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorebound | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex flex-column">
    <header class="site-header py-3">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <h1 class="h2 mb-0">Lorebound</h1>
            <img class="brand-image" src="images/dogeMorionHat.jpg" alt="Doge Morion Hat" />
          </div>
          <p class="tagline mb-0">A roguelike by Andrew Hokanson</p>
          <a href="https://github.com/Gfniblib/Startup">Github Repository</a>
        </div>
      </div>
      <nav class="container mt-3" aria-label="Main navigation">
        <div class="d-flex flex-wrap gap-3">
          <a href="index.html">Login</a>
          <a href="game.html">Game</a>
          <a href="leaderboard.html">High Scores</a>
        </div>
      </nav>
    </header>

    <main class="container page-content flex-grow-1">
      <div class="row g-4">
        <div class="col-12 col-lg-8 order-2 order-lg-1">
          <div class="login-panel p-4">
            <h2>Login</h2>
            <p>Create a new account or login</p>
            <fieldset>
              <legend class="h5">Account Information</legend>
              <form>
                <div class="mb-3">
                  <label class="form-label" for="username">Player name</label>
                  <input class="form-control" type="text" id="username" name="username" placeholder="Username" />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="password">Password</label>
                  <input class="form-control" type="password" id="password" name="password" placeholder="Enter password" />
                </div>
                <button class="btn btn-primary me-2" type="submit">Create account</button>
                <button class="btn btn-outline-primary" type="button">Login</button>
              </form>
            </fieldset>
          </div>
        </div>
        <aside class="col-12 col-lg-4 order-1 order-lg-2">
          <div class="account-panel">
            <h3 class="h5">Logged in as</h3>
            <p class="mb-0">JohnDoe</p>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer text-center py-3">
      <p class="mb-0">&copy; 2026 Lorebound no copyrights here. No rights reserved.</p>
    </footer>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
